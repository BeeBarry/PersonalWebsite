variables:
  # Corepack ska ladda ner pinnad pnpm-version utan interaktiv [Y/n]-prompt
  # (annars kan jobbet hänga/faila i CI vid första nedladdningen).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

stages:
  - test
  - deploy

# Detta är "testet" för koden som kommer in i dev branchen.
test_develop:
  stage: test
  image: node:lts
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    - echo "Build succeeded, getting ready to deploy to main "
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Initieras först när "testet" i dev gått igenom utan errors.
# GitLab Pages publicerar 'public'-artefakten nedan direkt – ingen push till
# main eller någon token behövs (det gamla merge/push-main-steget är borttaget).
pages:
  stage: deploy
  image: node:lts
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    # Bygger sajten; artefakten 'public/' deployas av GitLab Pages.
    - pnpm build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      